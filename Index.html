<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacman Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>PACMAN GAME</h1>
    <div class="game-container">
        <div class="game-info">
            <div>Score : <span id="score">0</span></div>
            <div>Nyawa : <span id="lives">3</span></div>
        </div>
        <div id="game-board"></div>
        <div class="control">
            <button id="start-btn">Start Game</button>
            <button id="reset-btn">Reset Game</button>
        </div>
    </div>
    <div id="game-over" class="game-over">
        <h2> Game Over</h2>
        <p>Skor Akhir : <span id="final-score">0</span></p>
        <button id="restart-btn">Main Lagi</button>
    </div>
    <div id="game-won" class="game-won">
        <h2> Game Over</h2>
        <p>Skor Akhir : <span id="win-score">0</span></p>
        <button id="play-again-btn"> Main Lagi </button>
    </div>
    <script src="script.js"></script>
</body>
</html>
